<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Bau-Hub</title>
<style>
:root {
  --bg: #f4f2ee;
  --panel: #ffffff;
  --panel-2: #ece9e3;
  --line: #d9d4ca;
  --text: #1f1d1a;
  --muted: #6b665d;
  --accent: #3f7a2a;
  --warn: #9a5b00;
  --warn-bg: #fff3dc;
  --early: #3f8a2c;  --early-ink: #ffffff;
  --mid:   #7a7f87;  --mid-ink:   #ffffff;
  --late:  #138a83;  --late-ink:  #ffffff;
  --end:   #7b4fd1;  --end-ink:   #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #202226; --panel-2: #2a2c31; --line: #34373d;
    --text: #e9e6e0; --muted: #9b978f; --accent: #7cc35a;
    --warn: #f0b05a; --warn-bg: #3a2c15;
    --early: #5da83f; --early-ink: #0f1a0b;
    --mid:   #c9ccd1; --mid-ink:   #1b1c1f;
    --late:  #4fd8cf; --late-ink:  #062523;
    --end:   #a985ff; --end-ink:   #1a0f33;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --panel: #202226; --panel-2: #2a2c31; --line: #34373d;
  --text: #e9e6e0; --muted: #9b978f; --accent: #7cc35a;
  --warn: #f0b05a; --warn-bg: #3a2c15;
  --early: #5da83f; --early-ink: #0f1a0b;
  --mid:   #c9ccd1; --mid-ink:   #1b1c1f;
  --late:  #4fd8cf; --late-ink:  #062523;
  --end:   #a985ff; --end-ink:   #1a0f33;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

header { padding: 28px 0 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 36px; height: 36px; flex: none; image-rendering: pixelated;
  background:
    linear-gradient(var(--early) 0 0) 0 0/100% 34% no-repeat,
    linear-gradient(#7a5533 0 0) 0 100%/100% 66% no-repeat;
  border-radius: 4px;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.18);
}
h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }

.tools {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  padding: 10px 0;
}
.tools .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search {
  flex: 1 1 240px; min-width: 0;
  padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); font: inherit;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 6px 10px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.t[aria-pressed="true"][data-tier="early"] { background: var(--early); color: var(--early-ink); border-color: var(--early); }
.chip.t[aria-pressed="true"][data-tier="mid"]   { background: var(--mid);   color: var(--mid-ink);   border-color: var(--mid); }
.chip.t[aria-pressed="true"][data-tier="late"]  { background: var(--late);  color: var(--late-ink);  border-color: var(--late); }
.chip.t[aria-pressed="true"][data-tier="end"]   { background: var(--end);   color: var(--end-ink);   border-color: var(--end); }
select.chip { appearance: none; padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.ghost { background: transparent; }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }

main { padding: 18px 0 40px; }
.group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; }
.mat {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden;
}
.mat > summary {
  list-style: none; cursor: pointer; padding: 13px 16px;
  display: flex; align-items: center; gap: 12px;
}
.mat > summary::-webkit-details-marker { display: none; }
.mat > summary::before {
  content: ""; width: 8px; height: 8px; flex: none;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg); transition: transform .15s;
}
.mat[open] > summary::before { transform: rotate(45deg); }
.mname { font-weight: 600; font-size: 16px; }
.dots { display: flex; gap: 4px; margin-left: auto; }
.dot { width: 22px; height: 6px; border-radius: 2px; background: var(--panel-2); }
.dot.on.early { background: var(--early); } .dot.on.mid { background: var(--mid); }
.dot.on.late { background: var(--late); }   .dot.on.end { background: var(--end); }
.built-n { font-size: 12px; color: var(--muted); min-width: 58px; text-align: right; }

.rows { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.tier {
  align-self: start; text-align: center; font-size: 12px; font-weight: 700;
  padding: 4px 6px; border-radius: 6px; letter-spacing: .02em;
}
.tier.early { background: var(--early); color: var(--early-ink); }
.tier.mid   { background: var(--mid);   color: var(--mid-ink); }
.tier.late  { background: var(--late);  color: var(--late-ink); }
.tier.end   { background: var(--end);   color: var(--end-ink); }
.vid { display: grid; grid-template-columns: 240px 1fr; gap: 14px; align-items: start; }
.vid + .vid { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.thumb {
  position: relative; display: block; width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
  background: var(--panel-2); border: 0; padding: 0; cursor: pointer;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .play {
  position: absolute; inset: 0; margin: auto; width: 46px; height: 32px; border-radius: 8px;
  background: rgba(0,0,0,.72);
}
.thumb .play::after {
  content: ""; position: absolute; left: 19px; top: 9px;
  border-left: 12px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent;
}
.thumb .len {
  position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.78); color: #fff;
  font-size: 12px; padding: 1px 5px; border-radius: 4px;
}
.thumb iframe { width: 100%; height: 100%; border: 0; display: block; }
.vtitle { font-weight: 600; margin: 0 0 2px; line-height: 1.35; }
.vtitle a { color: var(--text); text-decoration: none; }
.vtitle a:hover { text-decoration: underline; }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.tag { border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font-size: 12px; color: var(--text); }
.rate { color: var(--text); }
.note { font-size: 14px; margin: 6px 0 0; }
.mats { margin-top: 8px; font-size: 13px; }
.mats summary { cursor: pointer; color: var(--accent); }
.mats ul { list-style: none; padding: 8px 10px; margin: 6px 0 0; background: var(--panel-2); border-radius: 8px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px 14px; }
.mats li b { display: inline-block; min-width: 3.2em; text-align: right; margin-right: 6px; font-variant-numeric: tabular-nums; }
.mats .src { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.done { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 8px; cursor: pointer; user-select: none; }
.done input { width: 16px; height: 16px; accent-color: var(--accent); }
.vid.is-built .vtitle { text-decoration: line-through; text-decoration-color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; align-self: center; }
.none { text-align: center; color: var(--muted); padding: 40px 0; }
footer { color: var(--muted); font-size: 13px; padding: 10px 0 40px; border-top: 1px solid var(--line); }

@media (max-width: 720px) {
  .tools { position: static; }
  .row { grid-template-columns: 1fr; gap: 8px; }
  .tier { justify-self: start; }
  .vid { grid-template-columns: 1fr; }
  .dots { display: none; }
  .count { width: 100%; margin-left: 0; }
}
</style>
</head>
<body>
<header class="wrap">
  <div class="brand">
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h1>Minecraft Bau-Hub</h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>
</header>

<div class="tools">

</div>

<main class="wrap" id="list"></main>

  <span id="localhint"></span></p>
</footer>

const TIERS = [["early","Early Game"],["mid","Mid Game"],["late","Late Game"],["end","End Game"]];
const VERSIONS = ["26.3","26.2","26.1","1.21","1.20","1.19","1.18","1.17","1.16"];
const HOSTED = /^https?:$/.test(location.protocol);

const store = {
  get(k, d) { try { const v = localStorage.getItem("bauhub." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("bauhub." + k, JSON.stringify(v)); } catch (e) {} }
};
let built = new Set(store.get("gebaut", []));
const state = { q: "", group: "", tiers: new Set(), ver: "", hideBuilt: false };

// ---------- helpers
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify = s => esc(s).replace(/https?:\/\/[^\s)]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/, "")}</a>`);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function vparts(v) { return v.split(".").map(Number); }
function vcmp(a, b) {
  const x = vparts(a), y = vparts(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const d = (x[i] ?? 0) - (y[i] ?? 0); if (d) return d;
  }
  return 0;
}
// "1.21" als Obergrenze heißt "alle 1.21.x"
const upper = v => vparts(v).length === 2 ? v + ".999" : v;
function coversVersion(range, sel) {
  if (!sel) return true;
  if (!range) return false;
  const lo = sel, hi = upper(sel);
  const [a, b] = range;
  return vcmp(a, hi) <= 0 && (b === null || vcmp(upper(b), lo) >= 0);
}

// ---------- render
function videoHTML(r) {
  const year = r.datum ? r.datum.slice(0, 4) : "";
  const isBuilt = built.has(r.id);
  return `<div class="vid${isBuilt ? " is-built" : ""}" data-id="${r.id}">
    <button class="thumb" data-id="${r.id}" aria-label="Video abspielen: ${esc(r.titel)}">
      <img loading="lazy" alt="" src="https://i.ytimg.com/vi/${r.id}/mqdefault.jpg">
      <span class="play"></span>${r.dauer ? `<span class="len">${esc(r.dauer)}</span>` : ""}
    </button>
    <div>
      <p class="vtitle"><a href="https://www.youtube.com/watch?v=${r.id}" target="_blank" rel="noopener">${esc(r.titel)}</a></p>
      <div class="meta">
        <span>${esc(r.kanal)}${year ? " · " + year : ""}</span>
        ${r.versionen ? `<span class="tag">${esc(r.versionen)}</span>` : ""}
        ${r.rate ? `<span class="rate">${esc(r.rate)}</span>` : ""}
      </div>
      ${r.notiz ? `<p class="note">${linkify(r.notiz)}</p>` : ""}
      ${r.mat ? `<details class="mats"><summary>Materialliste · ${r.mat.length} Posten</summary>
        <ul>${r.mat.map(([n, it]) => `<li><b>${esc(n)}</b> ${esc(it)}</li>`).join("")}</ul>
        <p class="src">Quelle: ${esc(r.matq)} · Namen wie im Video</p></details>` : ""}
      ${r.matl ? `<p class="note"><a href="${esc(r.matl)}" target="_blank" rel="noopener">Materialliste (Datei/Bild) öffnen</a></p>` : ""}
      <label class="done"><input type="checkbox" data-built="${r.id}"${isBuilt ? " checked" : ""}> gebaut</label>
    </div>
  </div>`;
}

function visibleRows(m) {
  const out = [];
  for (const [key, label] of TIERS) {
    if (state.tiers.size && !state.tiers.has(key)) continue;
    let rows = m.stufen[key] || [];
    rows = rows.filter(r => r.leer ? !state.ver && !state.hideBuilt : coversVersion(r.v, state.ver) && !(state.hideBuilt && built.has(r.id)));
    if (rows.length) out.push([key, label, rows]);
  }
  return out;
}

function matches(m) {
  if (!state.q) return true;
  const hay = norm([m.material, ...(m.such || []),
    ...Object.values(m.stufen).flat().map(r => r.leer ? "" : `${r.titel} ${r.kanal}`)].join(" "));
  return norm(state.q).split(/\s+/).every(w => hay.includes(w));
}

let openSet = new Set(store.get("offen", []));
function render() {
  const list = document.getElementById("list");
  let html = "", nMat = 0, nVid = 0;
  for (const g of DATA.gruppen) {
    if (state.group && state.group !== g.name) continue;
    let gh = "";
    for (const m of g.eintraege) {
      if (!matches(m)) continue;
      const vis = visibleRows(m);
      if (!vis.some(([, , rows]) => rows.some(r => !r.leer))) continue;
      nMat++;
      const vids = Object.values(m.stufen).flat().filter(r => !r.leer);
      const nb = vids.filter(r => built.has(r.id)).length;
      nVid += vis.reduce((s, [, , rows]) => s + rows.filter(r => !r.leer).length, 0);
      const dots = TIERS.map(([k]) => `<span class="dot ${k}${(m.stufen[k] || []).some(r => !r.leer) ? " on" : ""}" title="${k}"></span>`).join("");
      const open = state.q || openSet.has(m.material) ? " open" : "";
      gh += `<details class="mat"${open} data-m="${esc(m.material)}">
        <summary><span class="mname">${esc(m.material)}</span><span class="dots">${dots}</span>
        <span class="built-n">${nb ? `${nb}/${vids.length} gebaut` : ""}</span></summary>
        <div class="rows">${vis.map(([k, label, rows]) => `<div class="row"><span class="tier ${k}">${label.replace(" Game", "")}</span><div>${
          rows.map(r => r.leer ? `<p class="empty">— ${esc(r.leer)}</p>` : videoHTML(r)).join("")}</div></div>`).join("")}</div>
      </details>`;
    }
    if (gh) html += `<section class="group"><h2>${esc(g.name)}</h2>${gh}</section>`;
  }
  list.innerHTML = html || `<p class="none">Nichts gefunden.</p>`;
  document.getElementById("count").textContent = `${nMat} Einträge · ${nVid} Videos`;
}

// ---------- controls
function setupChips() {
  const groups = document.getElementById("groups");
  groups.innerHTML = [["", "Alle"], ...DATA.gruppen.map(g => [g.name, g.name])]
    .map(([v, l]) => `<button class="chip" data-group="${esc(v)}" aria-pressed="${v === "" }">${esc(l)}</button>`).join("");
  groups.addEventListener("click", e => {
    const b = e.target.closest("[data-group]"); if (!b) return;
    state.group = b.dataset.group;
    groups.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });
  const tiers = document.getElementById("tiers");
  tiers.innerHTML = TIERS.map(([k, l]) => `<button class="chip t" data-tier="${k}" aria-pressed="false">${l.replace(" Game", "")}</button>`).join("");
  tiers.addEventListener("click", e => {
    const b = e.target.closest("[data-tier]"); if (!b) return;
    const k = b.dataset.tier;
    state.tiers.has(k) ? state.tiers.delete(k) : state.tiers.add(k);
    b.setAttribute("aria-pressed", state.tiers.has(k));
    render();
  });
  const ver = document.getElementById("ver");
  ver.insertAdjacentHTML("beforeend", VERSIONS.map(v => `<option value="${v}">läuft in ${v}${v.split(".").length === 2 && v.startsWith("1.") ? ".x" : ""}</option>`).join(""));
  ver.addEventListener("change", () => { state.ver = ver.value; render(); });
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
document.getElementById("hideBuilt").addEventListener("click", e => {
  state.hideBuilt = !state.hideBuilt; e.currentTarget.setAttribute("aria-pressed", state.hideBuilt); render();
});
document.getElementById("toggleAll").addEventListener("click", e => {
  const all = [...document.querySelectorAll(".mat")];
  const open = !all.every(d => d.open);
  all.forEach(d => d.open = open);
  e.currentTarget.textContent = open ? "Alle zuklappen" : "Alle aufklappen";
});
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  store.set("theme", root.dataset.theme);
});

const list = document.getElementById("list");
list.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches(".mat") || state.q) return;
  d.open ? openSet.add(d.dataset.m) : openSet.delete(d.dataset.m);
  store.set("offen", [...openSet]);
}, true);
list.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.built; if (!id) return;
  e.target.checked ? built.add(id) : built.delete(id);
  store.set("gebaut", [...built]);
  e.target.closest(".vid").classList.toggle("is-built", e.target.checked);
  const mat = e.target.closest(".mat");
  const ids = [...mat.querySelectorAll("[data-built]")].map(i => i.dataset.built);
  const nb = ids.filter(i => built.has(i)).length;
  mat.querySelector(".built-n").textContent = nb ? `${nb}/${ids.length} gebaut` : "";
  if (state.hideBuilt) render();
});
list.addEventListener("click", e => {
  const t = e.target.closest(".thumb"); if (!t || t.querySelector("iframe")) return;
  const id = t.dataset.id;
  if (!HOSTED) { window.open("https://www.youtube.com/watch?v=" + id, "_blank", "noopener"); return; }
  t.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="YouTube-Video"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
});

// ---------- start
(function init() {
  const th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th;
  const n = DATA.gruppen.reduce((s, g) => s + g.eintraege.length, 0);
  document.getElementById("sub").textContent = `Farmen & Infrastruktur für Minecraft Java · ${n} Einträge · Stand ${DATA.stand} · Ziel ${DATA.zielversion}`;
  if (!HOSTED) document.getElementById("localhint").textContent = "Lokal geöffnet starten Videos auf YouTube – YouTube erlaubt das Einbetten nur auf Webseiten.";
  setupChips();
  render();
})();
</script>
</body>
</html>
